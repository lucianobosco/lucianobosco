<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 258" width="1000" height="258" role="img">
<title>A voice assistant measured module by module: a phrase is heard by
large-v3-turbo at 2.0% word error, answered by llama3.1:8b in 0.75 seconds, spoken back
by a Rioplatense edge-tts voice at 1.4% round-trip error — and what the next agent
receives is what it understood, one word already wrong.</title>
<style>
  .ui { font-family: ui-sans-serif, -apple-system, "Segoe UI", Cantarell, "Noto Sans", sans-serif }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace }
  .h     { font-size: 14.5px; font-weight: 700; fill: #e9e4d9 }
  .sub   { font-size: 12.5px; fill: #8d8b85 }
  .tag   { font-size: 10px; font-weight: 700; letter-spacing: .1em }
  .model { font-size: 14px; font-weight: 600 }
  .num   { font-size: 11.5px; font-weight: 600 }
  .said  { font-size: 13px }
  .note  { font-size: 11.5px }

  /* The resting state is the finished diagram: every box, every number and the line
     at the bottom are painted with no animation at all. What replays is only the trip
     — a pulse of light along the wire — so an image where animation never runs still
     explains the whole thing. */
  .pulse { animation: 7.0s linear infinite travel; opacity: 0 }
  .meter { animation: 7.0s ease-in-out infinite listen }

  @keyframes travel {
    0%, 4%    { transform: translateX(0); opacity: 0 }
    10%       { opacity: .95 }
    64%       { transform: translateX(768px); opacity: .95 }
    72%, 100% { transform: translateX(768px); opacity: 0 }
  }
  /* The meter only leans while the phrase is being taken in */
  @keyframes listen {
    0%, 6%   { opacity: .35 }
    14%, 26% { opacity: 1 }
    40%, 100% { opacity: .35 }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse, .meter { animation: none }
    .pulse { opacity: 0 }
    .meter { opacity: 1 }
  }
</style>
<rect width="1000" height="258" rx="10" fill="#111419"/>
<rect x=".5" y=".5" width="999" height="257" rx="9.5" fill="none" stroke="#ffffff1f"/>

<text class="ui h" x="26" y="34">Every model in the loop was chosen by measuring, not by ear</text>
<text class="ui sub" x="26" y="55">Twelve transcription combinations, thirteen voices, seventeen reasoning models. RTX A5000.</text>

<!-- the audio going in -->
<g class="meter"><rect x="30.0" y="127.0" width="2.9" height="4.0" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="35.8" y="122.5" width="2.9" height="13.0" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="41.5" y="126.2" width="2.9" height="5.7" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="47.3" y="124.3" width="2.9" height="9.3" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="53.1" y="124.9" width="2.9" height="8.2" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="58.8" y="123.0" width="2.9" height="11.9" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="64.6" y="123.7" width="2.9" height="10.6" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="70.4" y="124.8" width="2.9" height="8.4" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="76.2" y="124.9" width="2.9" height="8.3" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="81.9" y="125.4" width="2.9" height="7.2" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="87.7" y="122.3" width="2.9" height="13.4" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="93.5" y="126.3" width="2.9" height="5.4" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="99.2" y="123.1" width="2.9" height="11.8" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="105.0" y="126.7" width="2.9" height="4.5" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="110.8" y="123.4" width="2.9" height="11.1" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="116.5" y="125.3" width="2.9" height="7.4" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="122.3" y="122.6" width="2.9" height="12.7" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="128.1" y="124.5" width="2.9" height="8.9" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="133.8" y="125.0" width="2.9" height="8.1" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="139.6" y="124.4" width="2.9" height="9.2" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="145.4" y="124.6" width="2.9" height="8.8" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="151.2" y="122.5" width="2.9" height="13.1" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="156.9" y="125.7" width="2.9" height="6.6" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="162.7" y="123.9" width="2.9" height="10.2" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="168.5" y="126.9" width="2.9" height="4.2" rx="1" fill="#7aa2c8" opacity=".55"/><rect x="174.2" y="122.7" width="2.9" height="12.6" rx="1" fill="#7aa2c8" opacity=".55"/></g>

<path d="M432 129.0 H463" stroke="#ffffff1f" stroke-width="1.5" fill="none"/><path d="M461 125.0 l5 4 -5 4" stroke="#8d8b85" stroke-width="1.5" fill="none"/><path d="M694 129.0 H725" stroke="#ffffff1f" stroke-width="1.5" fill="none"/><path d="M723 125.0 l5 4 -5 4" stroke="#8d8b85" stroke-width="1.5" fill="none"/>

<!-- The pulse walks the wire behind the cards, so it only shows in the gaps between
     stations: over a card it would smudge across the model name. Parked and invisible
     at rest, so it never owns the resting state. -->
<g class="pulse">
  <circle cx="188" cy="129.0" r="4.5" fill="#7aa2c8"/>
  <circle cx="188" cy="129.0" r="9" fill="#7aa2c8" opacity=".25"/>
</g>

<rect x="208" y="92" width="224" height="74" rx="9" fill="#191d24" stroke="#ffffff1f"/><rect x="470" y="92" width="224" height="74" rx="9" fill="#191d24" stroke="#ffffff1f"/><rect x="732" y="92" width="224" height="74" rx="9" fill="#191d24" stroke="#ffffff1f"/>
<text class="ui tag" x="224" y="113" fill="#8d8b85">HEARS</text><text class="ui model" x="224" y="134" fill="#e9e4d9">large-v3-turbo</text><text class="ui num" x="224" y="154" fill="#d0a02c">2.0% WER · 19× realtime</text><text class="ui tag" x="486" y="113" fill="#8d8b85">THINKS</text><text class="ui model" x="486" y="134" fill="#e9e4d9">llama3.1:8b</text><text class="ui num" x="486" y="154" fill="#d0a02c">0.75s to the first sentence</text><text class="ui tag" x="748" y="113" fill="#8d8b85">SPEAKS</text><text class="ui model" x="748" y="134" fill="#e9e4d9">edge · es-AR-Tomas</text><text class="ui num" x="748" y="154" fill="#d0a02c">1.4% round-trip WER</text>

<!-- and the part no metric catches -->
<text class="mono said" x="26" y="212" fill="#8d8b85">said</text>
<text class="mono said" x="72" y="212" fill="#e9e4d9">tocá el bucket de <tspan fill="#e9e4d9">Stripe</tspan></text>
<text class="mono said" x="26" y="234" fill="#8d8b85">heard</text>
<text class="mono said" x="72" y="234" fill="#e9e4d9">tocá el bucket de <tspan fill="#c2643f" text-decoration="underline">Constraip</tspan></text>
<text class="ui note" x="974" y="212" text-anchor="end" fill="#8d8b85">What the next agent receives is what it understood, not what was said.</text>
<text class="ui note" x="974" y="234" text-anchor="end" fill="#8d8b85">So one wrong word travels — and the error rate barely moves. That is the point.</text>
</svg>
