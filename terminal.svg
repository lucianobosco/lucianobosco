<text class="row out" x="22.0" y="60.5" xml:space="preserve" textLength="491.7" lengthAdjust="spacing" style="animation-delay:0.99s">luciano  -  software engineer  -  14+ years building backends</text>
<text class="row say" x="22.0" y="80.0" xml:space="preserve" textLength="628.7" lengthAdjust="spacing" style="animation-delay:1.18s"># I work on video and stock platforms: a few hundred thousand new files a day.</text>
