<text class="row out" x="22.0" y="392.0" xml:space="preserve" textLength="419.1" lengthAdjust="spacing" style="animation-delay:7.48s">  12 services        94 steps        1 uploaded file</text>
<text class="row say" x="22.0" y="411.5" xml:space="preserve" textLength="612.6" lengthAdjust="spacing" style="animation-delay:7.70s"># each of those twelve works on its own. the hard bugs live in between them.</text>
