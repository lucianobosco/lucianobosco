<text class="row say" x="22.0" y="158.0" xml:space="preserve" textLength="685.1" lengthAdjust="spacing" style="animation-delay:2.96s"># writing that query takes a minute. making it read 41 GB instead of 4 TB is the job.</text>
<text class="ps" x="22.0" y="197.0" xml:space="preserve" textLength="129.0" lengthAdjust="spacing" style="animation-delay:3.40s">luciano@bosco $ </text>
