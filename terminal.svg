nslate(223.5px,489.5px)}65.369%{transform:translate(223.5px,509.0px)}66.993%{transform:translate(223.5px,509.0px)}67.043%{transform:translate(707.1px,528.5px)}69.903%{transform:translate(707.1px,528.5px)}69.953%{transform:translate(151.0px,567.5px)}70.498%{transform:translate(191.3px,567.5px)}73.941%{transform:translate(191.3px,567.5px)}73.991%{transform:translate(473.4px,587.0px)}74.959%{transform:translate(473.4px,587.0px)}75.009%{transform:translate(255.7px,606.5px)}75.978%{transform:translate(255.7px,606.5px)}76.028%{transform:translate(618.4px,626.0px)}76.996%{transform:translate(618.4px,626.0px)}77.046%{transform:translate(489.5px,645.5px)}80.270%{transform:translate(489.5px,645.5px)}80.320%{transform:translate(151.0px,684.5px)}82.175%{transform:translate(288.0px,684.5px)}85.035%{transform:translate(288.0px,684.5px)}85.085%{transform:translate(465.3px,704.0px)}86.854%{transform:translate(465.3px,704.0px)}86.904%{transform:translate(562.0px,723.5px)}93.766%{transform:translate(562.0px,723.5px)}93.816%{transform:translate(465.3px,743.0px)}100%{transform:translate(465.3px,743.0px)}}
