<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" role="img" aria-label="tunnels-manager window">
<title>tunnels-manager v14.2 — localhost to identity-aware proxy to gke/cloud-sql in europe-southwest1; connection string mysql://127.0.0.1:3307/stock-content established</title>
<style>
  .ui   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Cantarell, "Noto Sans", sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .t    { fill:#eceaee }  .d { fill:#94949f }  .b { fill:#62a0ea }  .g { fill:#2ec27e }
  .hdr  { fill:#7c7c88; letter-spacing:1.2px; font-size:9px; font-weight:600 }

  /* packets: straight horizontal wires, CSS transforms only */
  .pkt  { animation: run 1.7s linear infinite; }
  .pkt2 { animation: run2 1.7s linear infinite; }
  .p2   { animation-delay:.28s } .p3 { animation-delay:.56s }
  @keyframes run  { from { transform: translateX(0) }    to { transform: translateX(186px) } }
  @keyframes run2 { from { transform: translateX(0) }    to { transform: translateX(-186px) } }

  /* handshake ring around the proxy */
  .ring { animation: spin 3.4s linear infinite; transform-origin: 440px 105px; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* live LED */
  .led  { animation: breathe 2.4s ease-in-out infinite }
  @keyframes breathe { 0%,100%{opacity:.25;r:9} 50%{opacity:.06;r:13} }

  /* connection string: cover parked OFF-TEXT by default, wipes across once on load */
  .cover { transform: translateX(624px); animation: wipe 1.5s .35s cubic-bezier(.2,.8,.2,1) 1 both; }
  @keyframes wipe { from { transform: translateX(0) } to { transform: translateX(624px) } }
  .caret { animation: blink 1.06s steps(1,end) infinite }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* latency sparkline draws itself once */
  .spark { stroke-dasharray:120; stroke-dashoffset:0; animation: draw 1.6s .3s ease-out 1 both }
  @keyframes draw { from { stroke-dashoffset:120 } to { stroke-dashoffset:0 } }

  @media (prefers-reduced-motion: reduce) {
    .pkt,.pkt2,.ring,.led,.caret,.spark { animation: none }
    .cover { animation: none }   /* stays parked off-text => final state */
  }
</style>

