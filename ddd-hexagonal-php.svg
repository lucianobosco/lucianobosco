<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img">
<title>The dependency arrow runs from infrastructure to application to domain, and the
port sits at the bottom with two adapters on it: the REST one, struck out because the API
version it was written against was deprecated, and the fixture one that replaced it. The
layers above the port did not change.</title>
<style>
  .ui { font-family: ui-sans-serif, -apple-system, "Segoe UI", Cantarell, "Noto Sans", sans-serif }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace }
  .h    { font-size: 14.5px; font-weight: 700; fill: #212a3e }
  .sub  { font-size: 12.5px; fill: #6b7793 }
  .tag  { font-size: 9.5px; font-weight: 700; letter-spacing: .11em }
  .what { font-size: 13px }
  .note { font-size: 11px; font-weight: 600 }
  .port { font-size: 10.5px; font-weight: 700; letter-spacing: .08em }
  .foot { font-size: 11.5px; fill: #6b7793 }

  /* The resting state is the finished diagram: the REST adapter is already struck out
     and the fixture one is already the live path. What replays is the handover — the
     strike drawing itself, the survivor coming up — so a still frame is the whole
     story rather than half of it. */
  .strike {
    stroke-dasharray: 200; animation: 8.0s ease-in-out infinite strike;
  }
  .dead { animation: 8.0s ease-in-out infinite fade }
  .live { animation: 8.0s ease-in-out infinite arrive }

  @keyframes strike {
    0%, 18%   { stroke-dashoffset: 200 }
    34%, 100% { stroke-dashoffset: 0 }
  }
  @keyframes fade {
    0%, 18%   { opacity: 1 }
    40%, 100% { opacity: .45 }
  }
  @keyframes arrive {
    0%, 40%   { opacity: .45 }
    56%, 100% { opacity: 1 }
  }
  @media (prefers-reduced-motion: reduce) {
    .strike, .dead, .live { animation: none }
    .strike { stroke-dashoffset: 0 }
    .dead { opacity: .45 }
  }
</style>
<rect width="1000" height="302" rx="10" fill="#eef1f6"/>
<rect x=".5" y=".5" width="999" height="301" rx="9.5" fill="none" stroke="#c3ccdd"/>

<text class="ui h" x="26" y="32">The port stopped being a diagram the day the API went away</text>
<text class="ui sub" x="26" y="52">A 2023 hiring exercise. The arrow only ever points one way, which is what made the swap below a new file.</text>

<path d="M318 105.0 H329" stroke="#4a5c94" stroke-width="1.5"/><path d="M327 101.0 l5 4 -5 4" stroke="#4a5c94" stroke-width="1.5" fill="none"/><path d="M630 105.0 H641" stroke="#4a5c94" stroke-width="1.5"/><path d="M639 101.0 l5 4 -5 4" stroke="#4a5c94" stroke-width="1.5" fill="none"/>
<rect x="26" y="74" width="288" height="62" rx="7" fill="#ffffff" stroke="#c3ccdd"/><text class="ui tag" x="40" y="95" fill="#6b7793">INFRASTRUCTURE</text><text class="mono what" x="40" y="119" fill="#212a3e">CountryController</text><rect x="338" y="74" width="288" height="62" rx="7" fill="#ffffff" stroke="#c3ccdd"/><text class="ui tag" x="352" y="95" fill="#6b7793">APPLICATION</text><text class="mono what" x="352" y="119" fill="#212a3e">CountryChecker</text><rect x="650" y="74" width="288" height="62" rx="7" fill="#ffffff" stroke="#c3ccdd"/><text class="ui tag" x="664" y="95" fill="#6b7793">DOMAIN</text><text class="mono what" x="664" y="119" fill="#212a3e">Criteria · the port</text>

<!-- the port itself, as the line everything below hangs from -->
<path d="M26 172 H974" stroke="#4a5c94" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="ui port" x="26" y="163" fill="#4a5c94">CountryRepository — THE PORT</text>

<g class="dead"><path d="M116 172 V198" stroke="#a8583f" stroke-width="1.5"/><rect x="26" y="198" width="288" height="58" rx="7" fill="#ffffff" stroke="#a8583f"/><text class="mono what" x="40" y="221" fill="#212a3e">RestCountriesRepository</text><text class="ui note" x="40" y="242" fill="#a8583f">v3.1 deprecated</text><path class="strike" d="M38 216 H234" stroke="#a8583f" stroke-width="2"/></g><g class="live"><path d="M428 172 V198" stroke="#2f7d5a" stroke-width="1.5"/><rect x="338" y="198" width="288" height="58" rx="7" fill="#ffffff" stroke="#2f7d5a"/><text class="mono what" x="352" y="221" fill="#212a3e">FixtureCountryRepository</text><text class="ui note" x="352" y="242" fill="#2f7d5a">default, no network</text></g>

<text class="ui foot" x="26" y="286">Two implementations, one interface. Replacing the dead one changed no use case, no domain object and no test.</text>
</svg>
